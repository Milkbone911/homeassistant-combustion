[tool.poetry]
name = "homeassistant-combustion"
version = "0.0.0"
description = ""
authors = ["Larry Gregory <lgregorydev@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "combustion", from = "custom_components" }]

[tool.poetry.dependencies]
python = ">=3.14.2,<3.15"

[tool.poetry.group.dev.dependencies]
colorlog = "==6.9.0"
homeassistant = "==2026.8.2"
ruff = "==0.11.5"

[tool.poetry.group.test.dependencies]
pytest = ">=7.3.1"
pytest-cov = ">=4.0.0"
pytest-homeassistant-custom-component = "==0.13.356"
# homeassistant.components.bluetooth unconditionally imports
# homeassistant.components.usb, whose manifest.json requires these two
# packages. Neither the homeassistant nor pytest-homeassistant-custom-component
# wheels pull them in (HA's real requirements_all.txt bundling does this at
# image-build time, which we don't have here), so collection fails without
# them. Pinned to the exact versions homeassistant/components/usb/manifest.json
# declares for 2026.8.2.
aiousbwatcher = "==1.1.2"
serialx = "==1.8.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.coverage.html]
directory = "test_results/cov_html"

[tool.coverage.xml]
output = "test_results/cov_xml/coverage.xml"

[tool.pytest.ini_options]
addopts = [
    "-rxf",
    "-v",
    "-l",
    "--asyncio-mode=auto",
    "--junitxml=test_results/pytest.xml",
    "--cov=./custom_components",
    "--cov-report=xml",
    "--cov-report=html",
]
filterwarnings = []
testpaths = ["tests"]
python_files = ["test_*.py"]

name: "Validate"

on:
  workflow_dispatch:
  # schedule:
  #   - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
      - "cook-library/**"
  pull_request:
    branches:
      - "main"

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"

  tests:
    runs-on: "ubuntu-latest"
    name: Run tests
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v4"
      - name: Setup Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install locked requirements
        run: |
          python3 -m pip install 'poetry~=2.3'
          python3 --version
          poetry --version
          poetry check --lock
          poetry install
      - name: Run tests
        run: |
          poetry run pytest
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@v1.1.51
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pytest-xml-coverage-path: ./test_results/cov_xml/coverage.xml
          junitxml-path: ./test_results/pytest.xml

  card-js:
    runs-on: "ubuntu-latest"
    name: Card resolver (Node 22)
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v4"
      - name: Setup Node
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"
      - name: Run bundled card resolver tests
        run: node --test tests/js/*.test.mjs

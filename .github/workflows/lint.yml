name: "Lint"

on:
  push:
    branches:
      - "main"
      - "cook-library/**"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4"

        - name: "Set up Python"
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install requirements"
          run: python3 -m pip install poetry~=2.3 && poetry install

        - name: "Run"
          run: |
          poetry run ruff check . --fix --diff || true
          poetry run ./scripts/lint
